name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Lint with Ruff
        run: |
          ruff check backend/ scripts/
          ruff format --check backend/ scripts/

      - name: Run backend tests with pytest
        run: |
          PYTHONPATH=backend/src pytest backend/tests

      - name: Run backend tests with unittest
        run: |
          PYTHONPATH=backend/src python -m unittest discover -s backend/tests

  frontend:
    name: Frontend CI (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck and build
        run: |
          pnpm --dir frontend build

      - name: Run unit tests
        run: |
          pnpm --dir frontend test

  e2e-and-visual:
    name: E2E & Visual CI (Playwright + Fake Jira)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend SPA
        run: |
          pnpm --dir frontend build

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Run Full-Stack E2E Integration tests
        run: |
          pnpm --dir frontend test:e2e

      - name: Run Visual Screenshot tests
        run: |
          pnpm --dir frontend test:visual

      - name: Upload Visual Screenshots and Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-and-reports
          path: |
            frontend/tests/screenshots/
          retention-days: 14

