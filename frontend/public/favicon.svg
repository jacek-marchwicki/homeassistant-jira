      stroke-width="0.6"
      stroke-linejoin="round"
    />
    <!-- Middle Layer -->
    <path
      d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"
      fill="none"
      stroke="url(#layer-grad-mid)"
