name: "Jira Dashboard"
version: "0.9.0"
slug: "jira_dashboard"
description: "Real-time, responsive Jira Dashboard with Optimistic UI and Home Assistant Ingress support"
url: "https://github.com/jacek-marchwicki/homeassistant-jira"
image: "ghcr.io/jacek-marchwicki/homeassistant-jira-{arch}"
arch:
  - aarch64
  - amd64
startup: "services"
boot: "auto"
init: false
homeassistant: "2024.1.0"
stage: "stable"
ingress: true
ingress_port: 8000
panel_icon: "mdi:jira"
panel_title: "Jira"
panel_admin: false
options:
  jira_url: "https://your-domain.atlassian.net"
  jira_email: "user@example.com"
  jira_api_token: ""
  jira_board_id: "engineering-1"
  polling_interval_seconds: 60
  gemini_api_key: ""
  gemini_model: "gemini-3.1-flash-lite-image"
  gemini_prompt_template: "A simple, colorful, kid-friendly storybook illustration depicting the chore or activity: '{summary}'. Clean shapes, gentle lighting, playful and clear visual cues for children, minimal background distractions, no text or words in the image."
  gemini_daily_limit: 100
  gemini_debounce_seconds: 300
  gemini_cache_retention_seconds: 2592000
schema:
  jira_url: "str?"
  jira_email: "str?"
  jira_api_token: "password?"
  jira_board_id: "str?"
  polling_interval_seconds: "int?"
  gemini_api_key: "password?"
  gemini_model: "str?"
  gemini_prompt_template: "str?"
  gemini_daily_limit: "int?"
  gemini_debounce_seconds: "int?"
  gemini_cache_retention_seconds: "int?"
