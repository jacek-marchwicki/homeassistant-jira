services:
  jira-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: jira-dashboard:latest
    container_name: jira-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - JIRA_URL=${JIRA_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_BOARD_ID=${JIRA_BOARD_ID:-engineering-1}
      - POLLING_INTERVAL_SECONDS=${POLLING_INTERVAL_SECONDS:-60}
      - JIRA_WEBHOOK_SECRET=${JIRA_WEBHOOK_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite-image}
      - GEMINI_PROMPT_TEMPLATE=${GEMINI_PROMPT_TEMPLATE:-}
      - GEMINI_DAILY_LIMIT=${GEMINI_DAILY_LIMIT:-100}
      - GEMINI_DEBOUNCE_SECONDS=${GEMINI_DEBOUNCE_SECONDS:-300}
      - GEMINI_CACHE_RETENTION_SECONDS=${GEMINI_CACHE_RETENTION_SECONDS:-2592000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
