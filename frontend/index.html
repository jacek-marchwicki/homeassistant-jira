<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Deep links (e.g. /task/HOME-123) must resolve relative assets against the app root,
         including under a Home Assistant Ingress prefix. -->
    <script>
      (function () {
        var p = window.location.pathname;
        var m = p.match(/^(.*?)\/(?:task\/[^/]+|create|board|backlog|people)\/?$/);
        var base = m ? m[1] + '/' : p.replace(/[^/]*$/, '');
        document.write('<base href="' + base + '">');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/png" href="pwa-192x192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jira" />
    <meta name="application-name" content="Jira Dashboard" />
    <meta name="description" content="Touch-optimized Jira Dashboard for Home Assistant and mobile devices" />
    <title>Jira Dashboard</title>
  </head>
  <body class="bg-[var(--jira-canvas)] text-[var(--jira-text-primary)] antialiased select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
